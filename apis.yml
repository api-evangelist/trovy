aid: trovy
name: Trovy
description: 'Trovy (Trovy Technologies, Inc.) is a Kleiner Perkins-backed fintech building
  "the homeowner platform" -- consumer credit products that turn home equity into a flexible
  financial tool. Its flagship Trovy HELOC Card is a credit card powered by home equity
  with variable APRs as low as 5.99%, alongside the Trovy 1Loan home-equity loan, with
  preapproval in minutes and rewards, balance-transfer, and payment-calculator features.
  Trovy is a consumer product and publishes no public developer API, docs, or SDK surface
  as of July 2026.'
